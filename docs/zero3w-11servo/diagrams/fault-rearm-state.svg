<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1140" viewBox="0 0 1120 1140"><title>故障锁止与显式复位</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#356383"/></marker></defs>
<rect width="100%" height="100%" fill="#f7fafc"/>
<text x="85" y="30" font-family="sans-serif" font-size="23" font-weight="bold" fill="#18354b">故障锁止与显式复位</text>
<path d="M300,133 L300,159.0 L300,159.0 L300,185" fill="none" stroke="#356383" stroke-width="2" marker-end="url(#arrow)"/>
<text x="307.0" y="153.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#356383">异常</text>
<path d="M300,263 L300,289.0 L300,289.0 L300,315" fill="none" stroke="#356383" stroke-width="2" marker-end="url(#arrow)"/>
<text x="307.0" y="283.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#356383">同tick</text>
<path d="M300,393 L300,419.0 L300,419.0 L300,445" fill="none" stroke="#356383" stroke-width="2" marker-end="url(#arrow)"/>
<text x="307.0" y="413.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#356383">OFF请求</text>
<path d="M515,473 L605,473" fill="none" stroke="#356383" stroke-width="2" marker-end="url(#arrow)"/>
<text x="560.0" y="463" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#356383">失败</text>
<path d="M605,503 L515,503" fill="none" stroke="#356383" stroke-width="2" marker-end="url(#arrow)"/>
<text x="560.0" y="493" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#356383">重试</text>
<path d="M300,523 L300,549.0 L300,549.0 L300,575" fill="none" stroke="#356383" stroke-width="2" marker-end="url(#arrow)"/>
<text x="307.0" y="543.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#356383">全部回读OFF</text>
<path d="M300,653 L300,679.0 L300,679.0 L300,705" fill="none" stroke="#356383" stroke-width="2" marker-end="url(#arrow)"/>
<text x="307.0" y="673.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#356383">显式请求</text>
<path d="M515,733 L605,733" fill="none" stroke="#356383" stroke-width="2" marker-end="url(#arrow)"/>
<text x="560.0" y="723" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#356383">条件不足</text>
<path d="M1035,755 L1090,755 L1090,595 L515,595" fill="none" stroke="#356383" stroke-width="2" marker-end="url(#arrow)"/>
<text x="802.5" y="588" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#356383">仍待人工请求</text>
<path d="M300,783 L300,809.0 L300,809.0 L300,835" fill="none" stroke="#356383" stroke-width="2" marker-end="url(#arrow)"/>
<text x="307.0" y="803.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#356383">条件满足</text>
<path d="M300,913 L300,939.0 L300,939.0 L300,965" fill="none" stroke="#356383" stroke-width="2" marker-end="url(#arrow)"/>
<text x="307.0" y="933.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#356383">人工确认</text>
<path d="M515,1015 L1090,1015 L1090,75 L515,75" fill="none" stroke="#356383" stroke-width="2" marker-end="url(#arrow)"/>
<text x="802.5" y="68" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#356383">门禁再次检查</text>
<rect x="85" y="55" width="430" height="78" rx="12" fill="#e8f3fc" stroke="#5681a0"/>
<text x="300" y="85" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">已就绪 / 受门禁显式启用</text>
<rect x="85" y="185" width="430" height="78" rx="12" fill="#e8f3fc" stroke="#5681a0"/>
<text x="300" y="215" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">首个故障：跌倒 / 总线 / 推理</text>
<text x="300" y="239" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">无效感知 / 可选重复IMU</text>
<rect x="85" y="315" width="430" height="78" rx="12" fill="#e8f3fc" stroke="#5681a0"/>
<text x="300" y="345" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">锁止：策略OFF，丢弃排队init</text>
<text x="300" y="369" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">health报告故障</text>
<rect x="85" y="445" width="430" height="78" rx="12" fill="#e8f3fc" stroke="#5681a0"/>
<text x="300" y="475" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">关闭真实设备扭矩并逐ID回读</text>
<rect x="605" y="445" width="430" height="78" rx="12" fill="#fff3de" stroke="#5681a0"/>
<text x="820" y="475" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">失败：未证明已OFF</text>
<text x="820" y="499" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">支撑/物理切电，继续重试</text>
<rect x="85" y="575" width="430" height="78" rx="12" fill="#e8f3fc" stroke="#5681a0"/>
<text x="300" y="605" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">成功OFF后等待rearm请求</text>
<text x="300" y="629" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">accepted仅表示排队</text>
<rect x="85" y="705" width="430" height="78" rx="12" fill="#e8f3fc" stroke="#5681a0"/>
<text x="300" y="735" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">控制线程以本tick新鲜样本判定</text>
<text x="300" y="759" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">直立/静止/无错/策略OFF</text>
<rect x="605" y="705" width="430" height="78" rx="12" fill="#fff3de" stroke="#5681a0"/>
<text x="820" y="735" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">未满足：rearm_result=refused</text>
<text x="820" y="759" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">锁止继续</text>
<rect x="85" y="835" width="430" height="78" rx="12" fill="#e8f3fc" stroke="#5681a0"/>
<text x="300" y="865" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">cleared 且 fault_latched=false</text>
<text x="300" y="889" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">动力/策略仍OFF</text>
<rect x="85" y="965" width="430" height="78" rx="12" fill="#e8f3fc" stroke="#5681a0"/>
<text x="300" y="995" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">另一次显式daemon init/enable</text>
<text x="300" y="1019" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">CLI独立init被拒绝</text>
</svg>
