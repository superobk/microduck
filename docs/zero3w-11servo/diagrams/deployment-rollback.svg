<path d="M300,653 L300,679.0 L820,679.0 L820,705" fill="none" stroke="#356383" stroke-width="2" marker-end="url(#arrow)"/>
<text x="567.0" y="673.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#356383">需回退</text>
<path d="M820,783 L820,809.0 L820,809.0 L820,835" fill="none" stroke="#356383" stroke-width="2" marker-end="url(#arrow)"/>
<text x="827.0" y="803.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#356383">11设备</text>
<path d="M820,783 L820,809.0 L300,809.0 L300,835" fill="none" stroke="#356383" stroke-width="2" marker-end="url(#arrow)"/>
<text x="567.0" y="803.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#356383">full15-restored</text>
<rect x="85" y="55" width="430" height="78" rx="12" fill="#e8f3fc" stroke="#5681a0"/>
<text x="300" y="85" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">审计只读预检</text>
<text x="300" y="109" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">身份/实际路径/模型/Runtime</text>
<rect x="605" y="55" width="430" height="78" rx="12" fill="#fff3de" stroke="#5681a0"/>
<text x="820" y="85" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">SSH关闭或身份不明</text>
<text x="820" y="109" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">停止，保留失败；不猜目标</text>
<rect x="85" y="185" width="430" height="78" rx="12" fill="#e8f3fc" stroke="#5681a0"/>
<text x="300" y="215" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">独立RUN目录 + 备份</text>
<text x="300" y="239" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">记录原服务状态/文件哈希</text>
<rect x="85" y="315" width="430" height="78" rx="12" fill="#e8f3fc" stroke="#5681a0"/>
<text x="300" y="345" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">事前写入事务清单及自有哈希</text>
<text x="300" y="369" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">随后才停止原动力/更新服务</text>
<rect x="85" y="445" width="430" height="78" rx="12" fill="#e8f3fc" stroke="#5681a0"/>
<text x="300" y="475" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">校验SCP + 安装独立候选</text>
<text x="300" y="499" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">官方程序不覆盖；安全hold</text>
<rect x="605" y="445" width="430" height="78" rx="12" fill="#fff3de" stroke="#5681a0"/>
<text x="820" y="475" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">安装中断 / 需回退</text>
<text x="820" y="499" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">使用事务清单恢复已完成步骤</text>
<rect x="85" y="575" width="430" height="78" rx="12" fill="#e8f3fc" stroke="#5681a0"/>
<text x="300" y="605" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">隔离fake验收</text>
<text x="300" y="629" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">候选硬件服务持续STOPPED</text>
<rect x="605" y="705" width="430" height="78" rx="12" fill="#fff3de" stroke="#5681a0"/>
<text x="820" y="735" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">重复回退 / 只移除自有unit</text>
<text x="820" y="759" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">缺失可跳过；哈希漂移停止</text>
<rect x="605" y="835" width="430" height="78" rx="12" fill="#fff3de" stroke="#5681a0"/>
<text x="820" y="865" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">仍缺头颈：保留本次安全hold</text>
<text x="820" y="889" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">明确部分回退，不重启</text>
<rect x="85" y="835" width="430" height="78" rx="12" fill="#e8f3fc" stroke="#5681a0"/>
<text x="300" y="865" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">人在场确认全部15关节已恢复</text>
<text x="300" y="889" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18354b">可移除本次hold，仍不自动启动</text>
</svg>
