<text x="560.0" y="463" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#356383">失败/中断</text>
<path d="M820,523 L820,614.0 L820,614.0 L820,705" fill="none" stroke="#356383" stroke-width="2" marker-end="url(#arrow)"/>
